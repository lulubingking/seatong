# 海瞳鱼鉴 Nginx HTTPS 参考配置

> 与《实训附录-Nginx_HTTPS配置.md》配套。生产部署时按实际域名、端口与路径调整。

```nginx
# ============================================================
# 海瞳鱼鉴（Seatong）Nginx HTTPS 部署参考配置
# 前端静态资源托管 + /api 反向代理至 FastAPI 后端
# ============================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 上传体积上限：单图 <=10MB、批量 <=9 张，预留余量
    client_max_body_size 100m;

    # 后端限流为 60 次/分钟，Nginx 侧可叠加一层限流（可选）
    limit_req_zone $binary_remote_addr zone=seatong_api:10m rate=30r/m;

    # HTTP -> HTTPS 强制跳转
    server {
        listen      80;
        server_name seatong.local;
        return 301  https://$host$request_uri;
    }

    # HTTPS 主站
    server {
        listen      443 ssl;
        server_name seatong.local;

        ssl_certificate      conf/seatong.crt;
        ssl_certificate_key  conf/seatong.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;

        # 前端静态资源（frontend-dist 构建产物）
        location / {
            root   html/seatong;
            index  index.html;
            try_files $uri $uri/ /index.html;   # SPA 路由回退
        }

        # 后端 API 反向代理
        location /api/ {
            proxy_pass         http://127.0.0.1:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            limit_req          zone=seatong_api burst=20 nodelay;
            proxy_read_timeout 60s;
        }

        # 静态图片直出可选：识别图像由后端管理，亦可反代
        # location /api/images/file/ {
        #     proxy_pass http://127.0.0.1:8000;
        # }
    }
}
```

## 多端口负载均衡版（附录配套）

```nginx
# 多个 uvicorn 实例负载均衡（如 8000/8001 双实例）
upstream seatong_backend {
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
}

server {
    listen      443 ssl;
    server_name seatong.local;

    ssl_certificate      conf/seatong.crt;
    ssl_certificate_key  conf/seatong.key;

    location /api/ {
        proxy_pass http://seatong_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
```

## 验证清单

| 验证项 | 验证方法 | 预期结果 |
|--------|----------|----------|
| 配置语法 | `nginx.exe -t` | syntax is ok / test is successful |
| 服务启动 | `nginx.exe` 后查看进程 | nginx 进程存在 |
| HTTPS 访问 | 浏览器打开 https://域名 | 首页正常加载 |
| HTTP 跳转 | 访问 http://域名 | 301 跳转至 HTTPS |
| API 代理 | 浏览器/命令访问 /api/health | 返回后端 JSON |
| SPA 回退 | 刷新二级路由页面 | 正常渲染不 404 |
