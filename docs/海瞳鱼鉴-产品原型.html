<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海瞳鱼鉴 SeaPupil · 产品原型 · 基于 CNN 的海洋鱼类图像分类系统</title>
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC; --surface-3:#F1F3F7;
  --border:#E3E7ED; --border-strong:#CFD6E0;
  --text:#0F172A; --text-2:#475569; --text-3:#64748B;
  --primary:#0E7C86; --primary-600:#0B626A; --primary-50:#E7F5F6; --primary-100:#C7E8EB;
  --ink:#062B2F;
  --accent:#185FA5; --accent-50:#E6F1FB;
  --warn:#B45309; --warn-50:#FAEEDA; --warn-border:#FAC775;
  --danger:#B42318; --danger-50:#FCEBEB; --danger-border:#F09595;
  --success:#15803D; --success-50:#EAF3DE; --success-border:#C0DD97;
  --metric:#64748B; --metric-deep:#475569;
  --radius-sm:8px; --radius:10px; --radius-lg:14px;
  --ring:0 0 0 3px rgba(14,124,134,.22);
  --font:-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{overflow-x:hidden;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;
     -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden;}
a{color:var(--primary-600);text-decoration:none;}
a:hover{text-decoration:underline;}
svg{display:block;}
.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;}
.ic-sm{width:15px;height:15px;}
.ic-lg{width:22px;height:22px;}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--border);}
.topbar-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;
           flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;
            align-items:center;justify-content:center;color:#fff;flex:0 0 auto;}
.brand-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:.3px;line-height:1.25;}
.brand-txt span{display:block;font-size:11px;color:var(--text-3);letter-spacing:.6px;line-height:1.2;}
.topnav{display:flex;gap:4px;margin-left:12px;flex:1;flex-wrap:wrap;min-width:0;}
.topnav a{padding:9px 13px;border-radius:var(--radius-sm);color:var(--text-2);font-size:13.5px;
          min-height:44px;display:flex;align-items:center;transition:background .18s,color .18s;cursor:pointer;}
.topnav a:hover{background:var(--surface-3);color:var(--text);text-decoration:none;}
.topnav a.on{background:var(--primary-50);color:var(--primary-600);font-weight:600;}
.topright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;}
@media (max-width:767px){
  .topbar-in{gap:10px;padding:8px 14px;}
  .topnav{order:3;flex-basis:100%;margin-left:0;gap:2px;}
  .topnav a{padding:8px 10px;font-size:13px;}
  .topright{margin-left:auto;gap:6px;}
}

/* ---------- 按钮 ---------- */
.btn{min-height:44px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);
     background:var(--surface);color:var(--text);font-family:var(--font);font-size:13.5px;font-weight:500;
     display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
     transition:background .18s,border-color .18s,color .18s;}
.btn:hover{background:var(--surface-3);border-color:#B6BFCC;}
.btn:focus-visible{outline:none;box-shadow:var(--ring);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-600);border-color:var(--primary-600);}
.btn-sm{min-height:34px;padding:0 11px;font-size:12.5px;gap:5px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2);}
.btn-ghost:hover{background:var(--surface-3);color:var(--text);}
.btn-danger{color:var(--danger);border-color:#E9C4C1;}
.btn-danger:hover{background:var(--danger-50);border-color:var(--danger-border);}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;background:var(--surface-3);
     border-color:var(--border);color:var(--text-3);}
.btn[disabled]:hover{background:var(--surface-3);}
.btn-block{width:100%;}
.btn-loading{pointer-events:none;opacity:.75;}

/* ---------- 布局 ---------- */
.shell{max-width:1440px;margin:0 auto;padding:22px 20px 64px;}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;}
@media (min-width:1025px){ .split{grid-template-columns:minmax(0,5fr) minmax(0,7fr);} }
.split-wide{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;}
@media (min-width:1025px){ .split-wide{grid-template-columns:minmax(0,6fr) minmax(0,6fr);} }
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
@media (min-width:768px){ .thumbs{grid-template-columns:repeat(3,minmax(0,1fr));} }
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}
.mb0{margin-bottom:0;}.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}
.muted{color:var(--text-3);font-size:12.5px;}
.muted-2{color:var(--text-2);font-size:13px;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- 卡片 ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;}
.card-tight{padding:14px 16px;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.card-h h3{margin:0;font-size:15px;font-weight:600;}
.card-h .sub{font-size:12.5px;color:var(--text-3);margin:3px 0 0;}
.sec-title{font-size:15px;font-weight:600;margin:0 0 3px;}
.sec-sub{font-size:12.5px;color:var(--text-3);margin:0 0 14px;}

/* ---------- 页面头 ---------- */
.view-title{font-size:22px;font-weight:600;margin:0 0 6px;letter-spacing:.2px;line-height:1.3;}
.view-sub{font-size:13px;color:var(--text-2);margin:0 0 18px;max-width:70ch;}

/* ---------- 上传区 ---------- */
.drop{border:2px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--surface-2);
      padding:40px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;
      min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.drop:hover{border-color:var(--primary);background:var(--primary-50);}
.drop.hot{border-color:var(--primary);background:var(--primary-50);border-style:solid;}
.drop-ic{width:52px;height:52px;border-radius:14px;background:var(--primary-50);color:var(--primary);
         display:flex;align-items:center;justify-content:center;border:1px solid var(--primary-100);}
.drop b{font-size:15px;font-weight:600;}
.drop .hint{font-size:12.5px;color:var(--text-3);}
.rule{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);
      padding:8px 12px;font-size:12.5px;color:var(--text-2);display:flex;gap:8px;align-items:flex-start;}
.rule code{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--border);
           border-radius:4px;padding:0 4px;}

/* ---------- 缩略图 ---------- */
.thumb{position:relative;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
       background:var(--surface-3);}
.thumb img{width:100%;height:112px;object-fit:cover;display:block;}
.thumb .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;border:none;
            background:rgba(15,23,42,.72);color:#fff;display:flex;align-items:center;justify-content:center;
            cursor:pointer;padding:0;}
.thumb .del:hover{background:var(--danger);}
.thumb .nm{font-size:11.5px;color:var(--text-2);padding:6px 8px;background:var(--surface);
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border);}
.thumb .bad{position:absolute;left:0;right:0;bottom:0;background:var(--danger-50);color:var(--danger);
            font-size:11px;padding:4px 8px;border-top:1px solid var(--danger-border);}
.thumb.err img{filter:grayscale(1);opacity:.45;}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1;padding:4px 8px;
     border-radius:999px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-2);
     white-space:nowrap;}
.tag-primary{background:var(--primary-50);border-color:var(--primary-100);color:var(--primary-600);}
.tag-warn{background:var(--warn-50);border-color:var(--warn-border);color:var(--warn);}
.tag-danger{background:var(--danger-50);border-color:var(--danger-border);color:var(--danger);}
.tag-success{background:var(--success-50);border-color:var(--success-border);color:var(--success);}
.tag-info{background:var(--accent-50);border-color:#B5D4F4;color:var(--accent);}
.tag-on{background:var(--success-50);border-color:var(--success-border);color:var(--success);}
.tag-off{background:var(--surface-3);border-color:var(--border-strong);color:var(--text-3);}

/* ---------- 提示条 ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);
       font-size:13px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-2);}
.alert b{font-weight:600;}
.alert-warn{background:var(--warn-50);border-color:var(--warn-border);color:#7A3D06;}
.alert-danger{background:var(--danger-50);border-color:var(--danger-border);color:#8C1D14;}
.alert-success{background:var(--success-50);border-color:var(--success-border);color:#14532D;}
.alert-info{background:var(--accent-50);border-color:#B5D4F4;color:#0C447C;}
.alert .ic{margin-top:1px;}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px;}
.field > label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text);}
.field .req{color:var(--danger);margin-left:2px;}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--border-strong);
     border-radius:var(--radius-sm);background:var(--surface);font-family:var(--font);font-size:14px;
     color:var(--text);transition:border-color .18s,box-shadow .18s;}
textarea.inp{min-height:74px;resize:vertical;line-height:1.6;}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:var(--ring);}
.inp[readonly],.inp[disabled]{background:var(--surface-3);color:var(--text-3);cursor:not-allowed;}
.inp.err{border-color:var(--danger);}
select.inp{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:34px;}
.f-hint{font-size:12px;color:var(--text-3);margin-top:5px;}
.f-err{font-size:12.5px;color:var(--danger);margin-top:5px;display:flex;gap:5px;align-items:flex-start;}
.f-ok{font-size:12.5px;color:var(--success);margin-top:5px;display:flex;gap:5px;align-items:center;}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:44px;}
.switch .track{width:46px;height:26px;border-radius:999px;background:var(--border-strong);position:relative;
               transition:background .2s;flex:0 0 auto;}
.switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
              transition:transform .2s;box-shadow:0 1px 2px rgba(15,23,42,.22);}
.switch.on .track{background:var(--primary);}
.switch.on .knob{transform:translateX(20px);}
.checkbox{width:17px;height:17px;border:1.5px solid var(--border-strong);border-radius:5px;background:var(--surface);
          cursor:pointer;flex:0 0 auto;appearance:none;margin:0;transition:background .15s,border-color .15s;}
.checkbox:checked{background:var(--primary);border-color:var(--primary);
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23FFFFFF' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 6L9 17l-5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center;background-size:12px;}
.checkbox:focus-visible{outline:none;box-shadow:var(--ring);}
.pwd-meter{height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;margin-top:7px;}
.pwd-meter i{display:block;height:100%;transition:width .25s,background .25s;}
.rules-list{list-style:none;padding:0;margin:8px 0 0;}
.rules-list li{font-size:12px;color:var(--text-3);display:flex;gap:6px;align-items:center;padding:2px 0;}
.rules-list li.ok{color:var(--success);}

/* ---------- 表格 ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
table.tbl th{text-align:left;font-weight:600;font-size:12.5px;color:var(--text-2);padding:11px 12px;
             background:var(--surface-3);border-bottom:1px solid var(--border);white-space:nowrap;}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
table.tbl tbody tr:last-child td{border-bottom:none;}
table.tbl tbody tr.clickable{cursor:pointer;transition:background .15s;}
table.tbl tbody tr.clickable:hover{background:var(--surface-2);}
table.tbl td.tnum{font-variant-numeric:tabular-nums;}
.cell-thumb{width:52px;height:40px;border-radius:6px;object-fit:cover;background:var(--surface-3);
            display:block;border:1px solid var(--border);}
.cell-name{font-weight:500;display:flex;align-items:center;gap:6px;}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;}
.pager .pgs{display:flex;gap:5px;align-items:center;}
.pg{min-width:34px;height:34px;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);
    font-size:13px;color:var(--text-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
    padding:0 8px;font-family:var(--font);transition:background .16s,color .16s,border-color .16s;}
.pg:hover{background:var(--surface-3);color:var(--text);}
.pg.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.pg[disabled]{opacity:.4;cursor:not-allowed;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab{padding:10px 15px;border:none;background:transparent;font-family:var(--font);font-size:13.5px;
     color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;min-height:44px;
     white-space:nowrap;transition:color .16s,border-color .16s;}
.tab:hover{color:var(--text);}
.tab.on{color:var(--primary-600);border-bottom-color:var(--primary);font-weight:600;}

/* ---------- 条形图（Top-5） ---------- */
.bars{display:flex;flex-direction:column;gap:11px;}
.bar-row{display:grid;grid-template-columns:minmax(90px,132px) minmax(0,1fr) 62px;gap:10px;align-items:center;}
.bar-name{font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-name b{font-weight:600;color:var(--text);}
.bar-track{height:20px;background:var(--surface-3);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--metric);transition:width .45s ease;}
.bar-top .bar-fill{background:var(--primary);}
.bar-top .bar-name{font-weight:600;color:var(--text);}
.bar-pct{font-size:13px;font-weight:500;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums;}
.bar-top .bar-pct{color:var(--primary-600);font-weight:600;}
@media (max-width:767px){
  .bar-row{grid-template-columns:minmax(76px,100px) minmax(0,1fr) 54px;gap:8px;}
  .bar-name,.bar-pct{font-size:12px;}
}

/* ---------- 结果区 ---------- */
.result-hero{background:linear-gradient(0deg,var(--primary-50),var(--primary-50));
       border:1px solid var(--primary-100);border-radius:var(--radius-lg);padding:18px 20px;}
.result-hero .lead{font-size:12px;color:var(--primary-600);letter-spacing:.8px;font-weight:600;}
.result-hero h2{margin:6px 0 2px;font-size:26px;font-weight:600;letter-spacing:.3px;}
.result-hero .latin{font-style:italic;color:var(--text-2);font-size:14px;}
.result-hero .conf{margin-top:14px;display:flex;align-items:baseline;gap:8px;}
.result-hero .conf b{font-size:40px;font-weight:600;line-height:1;color:var(--primary-600);
                     font-variant-numeric:tabular-nums;}
.result-hero .conf span{font-size:13px;color:var(--text-2);}
.orig-img{width:100%;max-height:480px;object-fit:contain;border-radius:var(--radius);border:1px solid var(--border);
          background:var(--surface-3);display:block;}
.img-ph{width:100%;min-height:230px;border-radius:var(--radius);border:1px dashed var(--border-strong);
        background:var(--surface-3);display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:8px;color:var(--text-3);font-size:12.5px;text-align:center;padding:16px;}
.disclaimer{border:1px solid var(--border);background:var(--surface-3);border-radius:var(--radius);
    padding:11px 13px;font-size:12px;line-height:1.65;color:var(--text-2);display:flex;gap:9px;align-items:flex-start;}
.disclaimer b{color:var(--text);font-weight:600;}
.fold{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:8px;}
.fold-h{width:100%;text-align:left;background:var(--surface-2);border:none;padding:11px 13px;font-family:var(--font);
        font-size:13.5px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;
        justify-content:space-between;gap:10px;min-height:44px;}
.fold-h:hover{background:var(--surface-3);}
.fold-b{padding:13px;font-size:13px;line-height:1.75;color:var(--text-2);max-height:230px;overflow-y:auto;
        border-top:1px solid var(--border);background:var(--surface);}
.fold-b p{margin:0 0 9px;}
.fold-b p:last-child{margin-bottom:0;}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.meta-item{background:var(--surface-3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;}
.meta-item .k{font-size:11.5px;color:var(--text-3);}
.meta-item .v{font-size:13.5px;font-weight:500;margin-top:2px;word-break:break-all;}

/* ---------- 统计卡 ---------- */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;}
.stat .k{font-size:12.5px;color:var(--text-3);}
.stat .v{font-size:26px;font-weight:600;line-height:1.25;margin-top:3px;letter-spacing:.3px;}
.stat .x{font-size:12px;color:var(--text-3);margin-top:2px;}

/* ---------- 阶段指示 ---------- */
.stages{display:flex;align-items:center;gap:0;flex-wrap:wrap;}
.stage{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);}
.stage .dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface);
            display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-3);flex:0 0 auto;}
.stage.done .dot{background:var(--primary);border-color:var(--primary);color:#fff;}
.stage.done{color:var(--text-2);}
.stage.cur .dot{border-color:var(--primary);color:var(--primary-600);font-weight:600;}
.stage.cur{color:var(--primary-600);font-weight:600;}
.stage-line{width:26px;height:1.5px;background:var(--border-strong);margin:0 8px;flex:0 0 auto;}
.stage.done + .stage-line{background:var(--primary-100);}
.skeleton{background:var(--surface-3);border-radius:var(--radius);animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* ---------- 追溯条 ---------- */
.trace{margin-top:26px;border:1px dashed var(--border-strong);border-radius:var(--radius);
       background:var(--surface-2);padding:11px 14px;}
.trace > b{font-size:12px;color:var(--text-2);display:block;margin-bottom:7px;letter-spacing:.3px;}
.trace .codes{display:flex;flex-wrap:wrap;gap:5px;}
.trace code{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--border);
            border-radius:5px;padding:2px 6px;color:var(--primary-600);}
.trace .note{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.6;}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.46);z-index:200;display:flex;align-items:center;
      justify-content:center;padding:20px;overflow-y:auto;}
.dlg{background:var(--surface);border-radius:var(--radius-lg);max-width:640px;width:100%;max-height:88vh;
     overflow-y:auto;border:1px solid var(--border);}
.dlg.wide{max-width:880px;}
.dlg.slim{max-width:440px;}
.dlg-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;
       justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2;}
.dlg-h h3{margin:0;font-size:16px;font-weight:600;}
.dlg-b{padding:18px 20px;font-size:13.5px;line-height:1.7;}
.dlg-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;
       flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;
          color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.icon-btn:hover{background:var(--surface-3);color:var(--text);}

/* ---------- Toast ---------- */
#toast-root{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:9px;
            max-width:340px;}
.toast{background:var(--surface);border:1px solid var(--border-strong);border-left:3px solid var(--primary);
       border-radius:var(--radius);padding:11px 14px;font-size:13px;color:var(--text);display:flex;gap:9px;
       align-items:flex-start;box-shadow:0 4px 14px rgba(15,23,42,.09);}
.toast.warn{border-left-color:var(--warn);}
.toast.err{border-left-color:var(--danger);}
.toast.ok{border-left-color:var(--success);}
.toast .ic{margin-top:1px;flex:0 0 auto;}

/* ---------- 抽屉 ---------- */
.side-back{display:none;}
@media (max-width:1024px){
  .side-back{display:none;}
}

/* ---------- 步骤条 / 其他 ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);
    font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--text-3);}
.kv .v{font-weight:500;text-align:right;}
.compare-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;}
.compare-card .hd{padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2);
                  font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;}
.compare-card img{width:100%;height:150px;object-fit:cover;background:var(--surface-3);display:block;}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:34px 26px;}
.hero h1{font-size:28px;font-weight:600;margin:0 0 10px;letter-spacing:.3px;line-height:1.35;}
.hero .lead{font-size:14.5px;color:var(--text-2);max-width:62ch;margin:0 0 20px;}
.flow-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);}
.flow-line .step{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px;
                 display:inline-flex;gap:6px;align-items:center;}
.sp-ic{width:26px;height:26px;border-radius:50%;background:var(--primary-50);color:var(--primary-600);
       display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:12px;font-weight:600;}
.sp-item{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border);}
.sp-item:last-child{border-bottom:none;}
.sp-item .nm{font-size:13px;font-weight:500;}
.sp-item .lt{font-size:11.5px;color:var(--text-3);font-style:italic;}
.progress{height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
.progress i{display:block;height:100%;background:var(--primary);transition:width .3s;}
.empty{text-align:center;padding:52px 20px;color:var(--text-3);}
.empty .ic-lg{margin:0 auto 12px;color:var(--border-strong);width:44px;height:44px;}
.empty b{display:block;font-size:15px;color:var(--text-2);font-weight:600;margin-bottom:5px;}
.empty p{font-size:13px;margin:0 0 16px;}
.tip-dot{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);}
.bulkbar{background:var(--ink);color:#fff;border-radius:var(--radius);padding:9px 14px;display:flex;
         align-items:center;gap:12px;flex-wrap:wrap;font-size:13px;}
.bulkbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff;min-height:34px;
              padding:0 11px;font-size:12.5px;}
.bulkbar .btn:hover{background:rgba(255,255,255,.2);}
.bulkbar .btn-danger{color:#FCA5A5;border-color:rgba(252,165,165,.4);}
.bulkbar .btn-danger:hover{background:rgba(252,165,165,.16);}
.two-col-list{columns:2;column-gap:20px;font-size:13px;color:var(--text-2);}
@media (max-width:600px){ .two-col-list{columns:1;} }
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion: reduce){

}

  {i:2,  d:'fish_3',  cn:'长棘光鳃鱼',   la:'Chromis chrysura',               n:3591,  morph:'体呈椭圆形，稍侧扁，全长约 8 ～ 12 厘米。体色以灰褐至淡褐为主，背部颜色较深，腹部偏银白。鳃盖后缘有一明显的白色斑块。背鳍硬棘 13 枚、软条 12 ～ 13 枚；背鳍末端软条延长成丝状，是该种显著特征。尾鳍深叉，上下叶末端尖细。', habit:'典型的群聚型雀鲷，常在礁坡上方水体中结成数十至数百尾的大群，随水流漂移取食浮游生物。遇掠食者时群体迅速下潜贴礁。杂食性，以浮游动物为主。', dist:'分布于西太平洋，北起日本南部，南至澳大利亚东北部与美拉尼西亚。栖息水深 3 ～ 40 米，以礁坡中上层水体最密集。'},
  {i:3,  d:'fish_4',  cn:'克氏双锯鱼',   la:'Amphiprion clarkii',             n:4047,  morph:'体呈椭圆形，侧扁，全长约 8 ～ 12 厘米，雌鱼大于雄鱼。体色变异较大：体侧橙黄至黑褐，具 3 条白色垂直宽带，分别位于眼后、体中部与尾柄前方。各鳍常带黑色边缘。背鳍硬棘 10 ～ 11 枚、软条 15 ～ 17 枚。', habit:'与大型海葵共生，是双锯鱼属中寄主种类最广的一种。体表分泌黏液以抵御海葵刺细胞。具先雄后雌的性转变特性，群体中体型最大者为雌鱼。杂食性，以藻类、桡足类及海葵残余食物为食。', dist:'广泛分布于印度—西太平洋，自红海、东非至日本南部、澳大利亚与密克罗尼西亚。水深 1 ～ 60 米，凡有合适海葵的礁区均可见。'},
  {i:4,  d:'fish_5',  cn:'弓月蝴蝶鱼',   la:'Chaetodon lunulatus',            n:2532,  morph:'体呈盘形，极侧扁，全长约 12 ～ 15 厘米。体色以淡黄褐为底，体侧具多条与体轴斜交的暗褐色细纹，纹路呈弓月状弧形排列，故名。头部有一条黑色纵带穿过眼睛。背鳍软条延长超过尾柄。尾鳍近截形，具黑色边缘。', habit:'成对或小群活动于珊瑚礁区，领域性较强。以珊瑚虫为主食，兼食小型无脊椎动物，是典型的珊瑚食性蝴蝶鱼，饲养难度较高。受惊时快速摆尾钻进珊瑚枝间。', dist:'分布于西太平洋至中太平洋，自日本南部、中国台湾沿海至澳大利亚、法属波利尼西亚。水深 1 ～ 30 米的珊瑚礁区。'},
  {i:5,  d:'fish_6',  cn:'川纹蝴蝶鱼',   la:'Chaetodon trifascialis',         n:188,   morph:'体呈长盘形，侧扁，全长约 12 ～ 18 厘米。体色以灰白为底，体侧具多条与背缘平行的黑色折线纹，纹路走向转折，形似连续的「川」字，是区别近缘种的关键特征。幼鱼体侧有一条贯穿眼部的黑色纵带，成鱼后消失。尾鳍黑色，末端白色。', habit:'强领域性，通常单独或成对守卫一片鹿角珊瑚群落，对进入领域的同类及其他鱼类均会驱赶。几乎专食鹿角珊瑚的珊瑚虫，食性高度专一。', dist:'分布于印度—西太平洋，自红海、东非至日本南部与澳大利亚大堡礁。水深 1 ～ 30 米，以鹿角珊瑚生长旺盛处为主。'},
  {i:6,  d:'fish_7',  cn:'康德锯鳞鱼',   la:'Myripristis kuntee',             n:448,   morph:'体呈椭圆形，侧扁，全长约 15 ～ 20 厘米。体色银红至橙红，鳃盖后缘有一深红色斑块。眼大，约占头长三分之一。背鳍前方有一明显的前向棘。鳞片较大且边缘粗糙，触之如锯，故名锯鳞鱼。各鳍红色，边缘色淡。', habit:'夜行性，白天结群藏于礁穴、礁檐阴影处，日落后外出在礁坡上方水层活动觅食。以浮游甲壳类为主食。受惊时发出鼓音。', dist:'分布于印度—太平洋，自东非、红海至夏威夷、日本南部与澳大利亚。水深 3 ～ 50 米，以礁穴与礁坡阴影处最常见。'},
  {i:7,  d:'fish_8',  cn:'双斑刺尾鱼',   la:'Acanthurus nigrofuscus',         n:216,   morph:'体呈椭圆形，侧扁，全长约 15 ～ 21 厘米。体色深褐至灰褐，体表常密布细小的暗色斑点。尾柄两侧各有一枚尖锐的骨质棘，是刺尾鱼科的典型防御器官。背鳍硬棘 9 枚、软条 24 ～ 27 枚。尾鳍浅凹，边缘色深。', habit:'白天结群在礁面刮食藻类，是礁区重要的藻类控制者。常与其他刺尾鱼混群。受威胁时侧身以尾棘相向。活动范围较大，随潮汐在礁面上下移动。', dist:'广泛分布于印度—太平洋，自红海、东非至日本南部、澳大利亚与夏威夷。水深 0 ～ 25 米的礁盘与礁坡。'},
  {i:8,  d:'fish_9',  cn:'横带粗唇鱼',   la:'Hemigymnus fasciatus',           n:239,   morph:'体呈长椭圆形，稍侧扁，全长约 20 ～ 30 厘米。吻部突出，唇厚而肉质，这是粗唇鱼属的共同特征。成鱼体侧具 5 ～ 6 条黑色垂直宽带，宽度约等于间距。体色灰白至淡黄。背鳍软条末端略延长。尾鳍圆形，边缘色暗。', habit:'栖息于礁盘与礁坡的碎石与珊瑚混合区，常在沙底上方缓慢巡游。以底栖无脊椎动物为主食，靠厚唇在石缝间探取猎物，遇威胁会钻入沙中。幼鱼体色与成鱼差异较大。', dist:'分布于印度—西太平洋，自红海、东非至日本南部与澳大利亚。水深 1 ～ 30 米的礁区沙底与碎石带。'},
  {i:9,  d:'fish_10', cn:'莎姆金鳞鱼',   la:'Neoniphon sammara',              n:297,   morph:'体呈长椭圆形，侧扁，全长约 18 ～ 25 厘米。体色银红，体侧具若干条淡色纵纹，鳞片边缘色深形成网格感。各鳍带红褐色斑纹与浅色边缘。眼大，吻端略尖。尾鳍深叉。与锯鳞鱼相比，本种体形更细长、色彩偏银。', habit:'群居性，白天成小群藏于礁枝与礁穴间，夜间分散在礁坡上方觅食浮游动物。以小型甲壳类为主食。受惊后迅速返回固定洞穴。', dist:'分布于印度—太平洋，自红海、东非至日本南部、澳大利亚与夏威夷。水深 0 ～ 46 米。'},
  {i:10, d:'fish_11', cn:'五带豆娘鱼',   la:'Abudefduf vaigiensis',           n:96,    morph:'体呈卵圆形，侧扁，全长约 12 ～ 17 厘米。体色灰白至淡黄，体侧具 5 条黑色垂直宽带，其中最末一条位于尾柄。鳞片较大，体表略显粗糙。背鳍硬棘 13 枚、软条 12 ～ 14 枚。尾鳍浅叉形，边缘色淡。', habit:'常成群在礁盘上层水体活动，也出现在码头、港湾等人工结构附近。杂食性，以浮游生物、藻类与小型无脊椎动物为食，摄食积极。繁殖期雄鱼在礁面清理巢位并守护卵块。', dist:'广泛分布于印度—太平洋，自红海、东非至日本南部、澳大利亚与法属波利尼西亚。水深 0 ～ 15 米，也常见于近岸浅水与港区。'},
  {i:11, d:'fish_12', cn:'黑马鞍鲀',     la:'Canthigaster valentini',         n:145,   morph:'体呈卵形，背部隆起，全身无鳞而代以细刺，全长约 8 ～ 11 厘米。体色乳白，背部有 4 条黑色垂直宽带，头顶与尾柄各有一黑斑，形似马鞍。吻部尖突，各齿愈合成喙状。腹部可膨大。', habit:'日行性，单独或成对活动于礁区底部，取食时啄食礁面。以藻类、海绵、珊瑚及小型无脊椎动物为食。受威胁时吸入海水膨胀身体使捕食者难以吞咽，皮肤含河鲀毒素。', dist:'分布于印度—西太平洋，自红海、东非至日本南部与澳大利亚。水深 1 ～ 55 米的礁区与砾石底。'},
  {i:12, d:'fish_13', cn:'摩鹿加雀鲷',   la:'Pomacentrus moluccensis',        n:179,   morph:'体呈椭圆形，侧扁，全长约 6 ～ 8 厘米，是本属中体型较小者。体色鲜艳的柠檬黄，通体一致，腹部略浅。幼鱼体侧有时可见淡蓝色细纹。背鳍硬棘 13 枚、软条 14 ～ 15 枚。眶下骨下缘光滑，无缺刻。', habit:'礁区常见的小型雀鲷，多单独或成小群在珊瑚枝间穿行。领域性强，会积极驱赶靠近的同类。以浮游生物与藻类为食。产卵于礁面基质上，由雄鱼护卵。', dist:'分布于西太平洋，自日本南部、中国台湾、菲律宾至澳大利亚大堡礁与新喀里多尼亚。水深 1 ～ 15 米的珊瑚礁区。'},
  {i:13, d:'fish_14', cn:'黑三角倒吊鱼', la:'Zebrasoma scopas',               n:88,    morph:'体呈高而扁的卵形，体高约为体长的一半以上，全长约 15 ～ 20 厘米。吻部突出成管状。体色褐至暗褐，体侧密布细小暗色点，常形成不规则的纵向细纹。尾柄两侧各有一枚白色骨质棘，周围组织色深。背鳍高，展开呈帆状。', habit:'日行性，单独或成小群在礁面刮食丝状藻类，是礁区重要的植食性鱼类。活动范围相对固定，沿固定路线往返摄食。受威胁时竖起背鳍并以尾棘防卫。', dist:'分布于印度—太平洋，自东非、红海至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 30 米的礁盘与礁坡。'},
  {i:14, d:'fish_15', cn:'黑鳍粗唇鱼',   la:'Hemigymnus melapterus',          n:40,    morph:'体呈长椭圆形，侧扁，全长约 25 ～ 35 厘米，是本属中体型较大者。吻部突出，唇厚。体色分为前后两段：前半部灰白至淡绿，后半部渐变为黑褐色，两段之间界限较明显。头部长有淡色斑点与短纹。尾鳍圆形，色深。', habit:'栖息于礁盘与礁坡的珊瑚与碎石混合区，常在沙底上方游动，靠厚唇翻动石块与珊瑚碎块觅取底栖无脊椎动物。受惊时迅速钻入沙中。幼鱼与成鱼体色差异显著。', dist:'分布于印度—太平洋，自红海、东非至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 30 米。'},
  {i:15, d:'fish_16', cn:'黄足笛鲷',     la:'Lutjanus fulvus',                n:204,   morph:'体呈长椭圆形，稍侧扁，全长约 25 ～ 40 厘米。体色黄褐至灰褐，体侧鳞片边缘色深，形成细密的网格纹。各鳍黄色至橙黄，胸鳍与腹鳍黄色最为明显，故名黄足笛鲷。头背部轮廓较平直。眼较大，位于头前部。', habit:'多单独或成小群活动，白天栖息于礁穴与礁檐下，黄昏后外出觅食。肉食性，以鱼类、虾类与头足类为食。领域性不强，但对同种个体有一定排斥。', dist:'分布于印度—太平洋，自东非、红海至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 75 米，以礁区与潟湖区最常见。'},
  {i:16, d:'fish_17', cn:'双线眶棘鲈',   la:'Scolopsis bilineata',            n:47,    morph:'体呈长椭圆形，侧扁，全长约 15 ～ 20 厘米。体色银白至淡黄褐，体侧有 2 条明显的黑色纵带：一条由吻端经眼延伸至背鳍前方，另一条位于体侧中部并延伸至尾柄。眶前骨后缘有 1 枚向后的棘，是眶棘鲈属的特征。背鳍具硬棘 10 枚。', habit:'常单独在礁盘沙底上方缓慢游动，遇威胁立即钻入沙中躲藏，是典型的沙底栖居型鱼类。以底栖无脊椎动物为主食，靠下颌探入沙中翻取食物。', dist:'分布于西太平洋至印度洋东部，自日本南部、中国南海至澳大利亚北部。水深 1 ～ 25 米的礁区沙底与碎石带。'},
  {i:17, d:'fish_18', cn:'鹦嘴鱼科',     la:'Scaridae',                       n:54,    morph:'科级特征：体呈长椭圆形至纺锤形，稍侧扁，体长因种而异。吻部前突呈喙状，上下颌齿愈合成齿板，形似鹦鹉喙，故名。体色多变，常见绿、蓝、褐、红等色系，多数种类体表具明显的色斑或条带。咽齿发达，用于研磨食物。尾鳍形态因种而异，由浅凹至深叉均有。', habit:'科级特征：日行性，栖息于珊瑚礁区，以礁面附生藻类为主食，摄食时以喙状齿板刮取礁面，是礁区重要的生物侵蚀者。多数种类有性转变现象。夜间多藏于礁穴或分泌黏液茧休息。', dist:'科级特征：广泛分布于全球热带与亚热带珊瑚礁区，以印度—太平洋种类最为丰富。栖息水深由潮间带至数十米不等。'},
  {i:18, d:'fish_19', cn:'黑缘单鳍鱼',   la:'Pempheris vanicolensis',         n:27,    morph:'体呈卵圆形，侧扁，全长约 12 ～ 18 厘米。体色银红至铜红，背部色调较深。眼大，占头长比例高，适应弱光环境。背鳍短小，起点位于体中部偏后，是单鳍鱼类的特征。臀鳍基部较长。尾鳍深叉。腹部轮廓较圆。', habit:'夜行性，白天结成密集鱼群藏于礁穴、礁檐或沉船内部，日落后成群上浮至水体中上层捕食浮游动物。趋光性强，夜间在有光源的水域尤为活跃。', dist:'分布于印度—西太平洋，自红海、东非至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 30 米，以礁穴与礁檐处最常见。'},
  {i:19, d:'fish_20', cn:'镰鱼',         la:'Zanclus cornutus',               n:19,    morph:'体呈高而扁的盘形，全长约 15 ～ 22 厘米，形态极为独特。吻部前伸成管状。体色以白色为底，具 3 条宽大的黑色垂直带；背部与臀鳍延伸成长丝状镰刀形，可超过体长。头顶两侧各有一小突起。尾鳍截形，黑色带白边。', habit:'单独或成对活动于礁区，多在礁面缓慢游动掠食海绵、藻类与附着生物。形态上以高鳍丝掩饰自身轮廓，游动时轮廓不规则，可迷惑捕食者。领域性较弱。', dist:'分布于印度—太平洋，自东非、红海至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 30 米的礁盘与礁坡。'},
  {i:20, d:'fish_21', cn:'黑嘴雀鲷',     la:'Neoglyphidodon nigroris',        n:14,    morph:'体呈椭圆形，侧扁，全长约 10 ～ 13 厘米。成鱼体色深褐至近黑，唇部与吻端黑色尤为明显，这是中文名的由来。体侧鳞片边缘色淡，形成隐约的网纹。幼鱼体色与成鱼差异极大：幼鱼体色鲜黄，背部有 2 条黑色纵带，随成长逐渐消失。背鳍硬棘 13 枚。', habit:'单独特居于珊瑚枝丛中，领域性强，对侵入领域者积极驱赶。以藻类与小型底栖无脊椎动物为食。生殖期雄鱼在礁面清理产卵基址并护卵。幼鱼与成鱼色型差异极大，曾长期被误认为不同种。', dist:'分布于西太平洋，自日本南部、中国台湾、菲律宾至印度尼西亚与澳大利亚北部。水深 1 ～ 15 米的珊瑚礁区。'},
  {i:21, d:'fish_22', cn:'黄纹炮弹鱼',   la:'Balistapus undulatus',           n:39,    morph:'体呈长椭圆形，稍侧扁，全长约 25 ～ 38 厘米。体色以深绿褐为底，体侧具多条与体轴斜交的橙黄色波状纵纹，纹路在背鳍与臀鳍上方转为水平。吻端尖突。背鳍第一棘粗壮，可竖起锁定，是炮弹鱼类的典型防御结构。尾柄两侧具骨质瘤突。尾部上下叶颜色常较深。', habit:'单独活动于礁区，领域性强，对入侵领地者会主动攻击。以海胆、贝类、甲壳类与珊瑚为食，靠强壮的颌齿咬碎硬壳猎物。夜间藏于礁穴休息。', dist:'广泛分布于印度—太平洋，自红海、东非至日本南部、澳大利亚与法属波利尼西亚。水深 1 ～ 50 米的礁区。'},

/* ---------- ④ 工具 ---------- */
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
/* 百分比：保留 1 位小数；四舍五入为 0.0% 时显示 < 0.1%（BR-RESULT-02） */
function fmtPct(v){
  var p = v * 100;
  if (p > 0 && p < 0.05) return '< 0.1%';
  return p.toFixed(1) + '%';
}
function fmtPctNum(v){
  var p = v * 100;
  if (p > 0 && p < 0.05) return '< 0.1';
  return p.toFixed(1);
}
function truncMid(s, n){
  if (s.length <= n) return s;
  var head = Math.ceil((n - 1) / 2), tail = Math.floor((n - 1) / 2);
  return s.slice(0, head) + '…' + s.slice(s.length - tail);
}
function nowStr(){
  var d = new Date();
  function p(n){ return n < 10 ? '0' + n : '' + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
         p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function toast(msg, kind){
  var root = document.getElementById('toast-root');
  if (!root) return;
  var id = 'toast-' + (++state.toastSeq);
  var iconName = kind === 'err' ? 'x_circle' : (kind === 'warn' ? 'alert' : (kind === 'ok' ? 'check_circle' : 'info'));
  var div = document.createElement('div');
  div.className = 'toast ' + (kind || '');
  div.id = id;
  div.innerHTML = ic(iconName, 'ic-sm') + '<span>' + esc(msg) + '</span>';
  root.appendChild(div);
  setTimeout(function(){
    var el = document.getElementById(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }, 3200);
}

/* 按首位类别与置信度构造 Top-5，剩余概率按降序分配到其余类别 */
function top5For(spIdx, conf){
  var out = [{cn:SPECIES[spIdx].cn, la:SPECIES[spIdx].la, p:conf}];
  var pool = [0.028, 0.019, 0.011, 0.0067, 0.0042, 0.0029, 0.0018, 0.0011];
  var rest = 0, i;
  for (i = 0; i < pool.length; i++) rest += pool[i];
  var scale = (1 - conf) / rest;
  var taken = {0:true}, idx = 0;
  for (i = 1; i < 5; i++){
    var p = pool[i - 1] * scale;
    while (taken[idx]) idx++;
    out.push({cn:SPECIES[idx].cn, la:SPECIES[idx].la, p:p});
    taken[idx] = true;
    idx++;
  }
  /* 用同批首位类别之外的相邻类别填充剩余候选 */
  var cands = [];
  for (i = 0; i < SPECIES.length; i++) if (i !== spIdx) cands.push(i);
  var seed = (spIdx * 7 + 3) % cands.length;
  var picked = [spIdx];
  for (i = 0; i < 4; i++) picked.push(cands[(seed + i * 5) % cands.length]);
  var uniq = [];
  for (i = 0; i < picked.length; i++) if (uniq.indexOf(picked[i]) < 0) uniq.push(picked[i]);
  var k = 1;
  while (uniq.length < 5){
    var nxt = cands[(seed + k * 3) % cands.length];
    if (uniq.indexOf(nxt) < 0) uniq.push(nxt);
    k++;
  }
  var res = [{cn:SPECIES[uniq[0]].cn, la:SPECIES[uniq[0]].la, p:conf}];
  for (i = 1; i < 5; i++){
    var pv = pool[i - 1] * scale;
    res.push({cn:SPECIES[uniq[i]].cn, la:SPECIES[uniq[i]].la, p:pv});
  }
  /* 归一化，保证 5 项之和与 1 一致（浮点误差 < 1e-6） */
  var s = 0;
  for (i = 0; i < res.length; i++) s += res[i].p;
  var diff = 1 - s;
  res[1].p += diff * 0.6;
  res[2].p += diff * 0.25;
  res[3].p += diff * 0.1;
  res[4].p += diff * 0.05;
  return res;
}

function pwdRules(p){
  return {
    len: p.length >= 8 && p.length <= 32,
    mix: /[A-Za-z]/.test(p) && /\d/.test(p),
    notName: !(p && state.regForm.name && p.toLowerCase() === state.regForm.name.toLowerCase())
  };
}
function pwdStrength(p){
  if (!p) return 0;
  var s = 0;
  if (p.length >= 8) s++;
  if (/[A-Za-z]/.test(p) && /\d/.test(p)) s++;
  if (p.length >= 12) s++;
  if (/[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(4, s);
}
function nameValid(n){ return /^[A-Za-z0-9_]{4,20}$/.test(n); }

      'BR-USER-05','BR-USER-14'],
    '用户名实时校验可用性与规则符合性；密码强度不足时给出具体原因（长度、字母数字组合、是否与用户名相同）；' +

/* ===== 历史记录  /history ===== */
function filteredRecords(){
  var f = state.historyFilters, out = [], i;
  for (i = 0; i < RECORDS.length; i++){
    var r = RECORDS[i];
    if (f.sp !== 'all' && String(r.spIdx) !== String(f.sp)) continue;
    if (f.kw && r.fn.toLowerCase().indexOf(f.kw.toLowerCase()) < 0) continue;
    if (f.range === 'd7'){
      if (r.t < '2026-09-14') continue;
    } else if (f.range === 'd30'){
      if (r.t < '2026-08-22') continue;
    } else if (f.range === 'custom'){
      if (f.from && r.t < f.from) continue;
      if (f.to && r.t > f.to + ' 23:59:59') continue;
    }
    out.push(r);
  }
  out.sort(function(a, b){
    return f.order === 'desc' ? (a.t < b.t ? 1 : -1) : (a.t > b.t ? 1 : -1);
  });
  return out;
}

    '原图已清理时，本页原图位置展示「原图已清理」占位，Top-5 结果与物种介绍不受影响。' +
    '原图不经静态目录直接暴露，一律经带鉴权的接口读取。'));

<script>
/* ===== 对比视图  /history/compare ===== */
function viewCompare(){
  var sel = state.compareSel;
  var h = [];
  h.push('<div class="row" style="margin-bottom:14px">' +
    '<button class="btn btn-sm" data-act="go" data-route="history">' + ic('arrow_left', 'ic-sm') + ' 返回历史列表</button>' +
    '</div>');
  h.push('<div class="row-between"><div><h1 class="view-title">图像对比</h1>' +
    '<p class="view-sub">并排展示 2 ～ 4 条记录的缩略图、物种名、置信度与识别时间，用于横向核对同一批调查样本的判定结果。</p></div>' +
    '<div class="row">' + tag('已选 ' + sel.length + ' 条', 'tag-primary', 'compare') +
    '<button class="btn" data-act="go" data-route="history">重新选择</button></div></div>');

  if (sel.length < 2){
    h.push('<div class="card mt16">' + emptyBox('compare', '至少需要选择 2 条记录',
      '在历史记录页勾选 2 ～ 4 条记录后进入对比视图', '返回历史记录', 'goHistory') + '</div>');
  } else {
    var cols = sel.length;
    h.push('<div class="mt16" style="display:grid;gap:14px;grid-template-columns:minmax(0,1fr);' +
      (cols >= 2 ? '' : '') + '">');
    if (cols >= 2){
      h.push('<style>.cmp{grid-template-columns:repeat(' + Math.min(cols, 4) + ',minmax(0,1fr))}' +
        '@media (max-width:900px){.cmp{grid-template-columns:minmax(0,1fr)}}</style>');
      h.push('<div class="cmp" style="display:grid;gap:14px">');
      for (var i = 0; i < sel.length; i++){
        var r = sel[i], sp = SPECIES[r.spIdx];
        h.push('<div class="compare-card">' +
          '<div class="hd">' + ic('fish', 'ic-sm') + '<span>' + esc(sp.cn) + '</span>' +
          (r.low ? tag('低', 'tag-warn') : '') + '</div>' +
          fishImg(r.img, '', sp.cn + ' 示例图像') +
          '<div style="padding:12px">' +
          '<div class="latin muted" style="font-style:italic;font-size:12px">' + esc(sp.la) + '</div>' +
          '<div class="row-between mt12"><span class="muted">置信度</span>' +
          '<b class="num" style="font-size:18px;color:' + (r.low ? 'var(--warn)' : 'var(--primary-600)') + '">' +
          r.conf.toFixed(1) + '%</b></div>' +
          '<div class="kv"><span class="k">识别时间</span><span class="v num" style="font-size:12px">' + esc(r.t) + '</span></div>' +
          '<div class="kv"><span class="k">耗时</span><span class="v num">' + r.ms + ' ms</span></div>' +
          '<div class="kv"><span class="k">文件名</span><span class="v" style="font-size:12px" title="' +
          esc(r.fn) + '">' + esc(truncMid(r.fn, 18)) + '</span></div>' +
          '<button class="btn btn-sm btn-block mt12" data-act="openRecord" data-id="' + r.id + '">查看详情</button>' +
          '</div></div>');
      }
      h.push('</div>');
    }
    h.push('</div>');

    /* 差异小结 */
    h.push('<div class="card mt16"><div class="card-h"><h3>对比小结</h3>' +
      tag('结果恒定，不重新推理', 'tag-info', 'lock') + '</div>');
    var confs = sel.map(function(x){ return x.conf; });
    var maxR = sel[confs.indexOf(Math.max.apply(null, confs))];
    var minR = sel[confs.indexOf(Math.min.apply(null, confs))];
    var lowN = sel.filter(function(x){ return x.low; }).length;
    h.push('<div class="table-wrap"><table class="tbl"><thead><tr>' +
      '<th>对比维度</th><th>结果</th></tr></thead><tbody>' +
      '<tr><td>最高置信度</td><td>' + esc(SPECIES[maxR.spIdx].cn) + '　<b class="num">' +
      maxR.conf.toFixed(1) + '%</b></td></tr>' +
      '<tr><td>最低置信度</td><td>' + esc(SPECIES[minR.spIdx].cn) + '　<b class="num">' +
      minR.conf.toFixed(1) + '%</b></td></tr>' +
      '<tr><td>低置信度记录数</td><td>' + lowN + ' 条（阈值为 ' + CONFIG.lowConfThreshold.toFixed(2) + '）</td></tr>' +
      '<tr><td>涉及物种数</td><td>' + new Set(sel.map(function(x){ return x.spIdx; })).size + ' 类</td></tr>' +
      '</tbody></table></div>');
    h.push('<div class="mt12 muted">对比视图仅做并列展示，不重新推理、不重算概率；' +
      '所有数值均取自各记录归档时保存的结果。条形图同时标注数值，颜色不作为唯一信息载体。</div>');
    h.push('</div>');
  }

  h.push(trace(['FR-HISTORY-04','BR-HISTORY-09','BR-RESULT-08'],
    '勾选 2 ～ 4 条记录进入对比视图，并排展示缩略图、物种名、置信度与识别时间；' +
    '少于 2 条或多于 4 条时给出明确限制提示，不做静默截断。'));
  return h.join('');
}

    limit + '</b> 张。按 PRD BR-UPLOAD-03，超出部分整体拒绝并提示分批上传，不做静默截断。</p>' +

/* 禁用 / 启用用户确认 */
function modalToggleUser(id){
  var u = null;

    openModal('无法执行该操作',
      alertBox('err', '不能对当前登录账号执行该操作',
        '管理员不可禁用或删除自身账号，避免管理权限丢失（BR-USER-11，对应 AC-FR-USER-07-2）。'),
      '<button class="btn btn-primary" data-act="closeModal">知道了</button>', 'slim');
    return;
  }
  var disabling = u.status === 'on';
  modalConfirm(disabling ? '确认禁用该账号' : '确认启用该账号',
    '<p style="margin:0 0 12px">账号 <b>' + esc(u.name) + '</b>（' + esc(u.nick) + '）当前状态：' +
    (disabling ? '启用中' : '已禁用') + '</p>' +

/* 系统配置保存确认（PRD 5.4.5：逐项列出变更前后取值） */
function modalSaveConfig(){
  var c = state.cfg, changes = [];
  var inputs = [
    ['cf-th', '置信度阈值', CONFIG.lowConfThreshold.toFixed(2), function(v){ return parseFloat(v).toFixed(2); }],
    ['cf-bl', '单批上传上限', String(CONFIG.batchLimit), function(v){ return String(parseInt(v, 10)); }],
    ['cf-rd', '图像留存天数', String(CONFIG.retentionDays), function(v){ return String(parseInt(v, 10)); }]
  ];
  var i, rows = '';
  for (i = 0; i < inputs.length; i++){
    var el = document.getElementById(inputs[i][0]);
    if (!el) continue;
    var nv = inputs[i][3](el.value);
    if (nv !== inputs[i][2]){
      rows += '<tr><td>' + esc(inputs[i][1]) + '</td><td class="tnum">' + esc(inputs[i][2]) +
        '</td><td class="tnum" style="font-weight:600;color:var(--primary-600)">' + esc(nv) + '</td></tr>';
    }
  }
  if (c.colorCorrect !== CONFIG.colorCorrect){
    rows += '<tr><td>水下色偏校正</td><td>' + (CONFIG.colorCorrect ? '已开启' : '已关闭') +
      '</td><td style="font-weight:600;color:var(--primary-600)">' + (c.colorCorrect ? '已开启' : '已关闭') + '</td></tr>';
  }
  var body;
  if (!rows){
    body = alertBox('info', '没有检测到变更项', '当前表单取值与已保存配置一致，无需保存。' +
      '如需恢复出厂设置，可使用「恢复默认值」。');
    openModal('保存系统配置', body,
      '<button class="btn btn-primary" data-act="closeModal">知道了</button>', 'slim');
    return;
  }
  body = '<p style="margin:0 0 12px">以下配置项将发生变更，保存后立即生效：</p>' +
    '<div class="table-wrap"><table class="tbl"><thead><tr><th>配置项</th><th>变更前</th><th>变更后</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>' +
    alertBox('warn', '调整置信度阈值会改变识别结果的判定',
      '首位候选概率低于阈值时将被标记为低置信度并触发前端可靠性提示（BR-RECOG-04、AC-FR-USER-09-1）。' +
      '调整图像留存天数不影响已归档的识别结果与元数据。');
  openModal('保存系统配置', body,
    '<button class="btn" data-act="closeModal">取消</button>' +
    '<button class="btn btn-primary" data-act="confirmSaveConfig">确认保存</button>');
}

</script>
<script>
/* ---------- ⑥ 视图映射与路由 ---------- */
var VIEWS = {
  home: viewHome,
  recognize: viewRecognize,
  about: viewAbout,
  login: viewLogin,
  register: viewRegister,
  history: viewHistory,
  historyDetail: viewHistoryDetail,
  compare: viewCompare,
  profile: viewProfile,
  adminUsers: viewAdminUsers,
  adminRecords: viewAdminRecords,
  adminConfig: viewAdminConfig,
  notFound: view404
};
var ROUTE_HASH = {
  home:'#/', recognize:'#/recognize', about:'#/about', login:'#/login', register:'#/register',
  history:'#/history', historyDetail:'#/history/:id', compare:'#/history/compare',
  profile:'#/profile', adminUsers:'#/admin/users', adminRecords:'#/admin/records',
  adminConfig:'#/admin/config', notFound:'#/404'
};
var AUTH_ROUTES = ['history','historyDetail','compare','profile'];
var ADMIN_ROUTES = ['adminUsers','adminRecords','adminConfig'];

function topNavItems(){
  var items = [
    {r:'home', t:'首页', ic:'home'},
    {r:'recognize', t:'识别工作台', ic:'scan'},
    {r:'about', t:'关于与免责', ic:'shield'}
  ];
  if (state.authed){
    items.push({r:'history', t:'历史记录', ic:'history'});
    items.push({r:'profile', t:'个人中心', ic:'user'});
  }
  return items;
}
function renderTopnav(){
  var nav = document.getElementById('topnav');
  if (nav){
    var items = topNavItems(), out = '';
    for (var i = 0; i < items.length; i++){
      var on = (state.route === items[i].r) ||
        (items[i].r === 'history' && (state.route === 'compare' || state.route === 'historyDetail'));
      out += '<a href="' + ROUTE_HASH[items[i].r] + '" data-act="go" data-route="' + items[i].r + '"' +
        (on ? ' class="on"' : '') + ' aria-current="' + (on ? 'page' : 'false') + '">' +
        ic(items[i].ic, 'ic-sm') + ' ' + esc(items[i].t) + '</a>';
    }
    nav.innerHTML = out;
    hydrateIcons(nav);
  }
  var tr = document.getElementById('topright');
  if (tr){
    var o = '';
    if (state.authed){
      var isAdmin = state.role === 'admin';
      o += '<span class="tag tag-primary">' + ic(isAdmin ? 'shield' : 'user', 'ic-sm') + ' ' +
        esc(state.me.nick || state.me.name) + '</span>';
      if (isAdmin) o += '<button class="btn btn-sm" data-act="go" data-route="adminUsers">' +
        ic('gear', 'ic-sm') + ' 管理后台</button>';
      o += '<button class="btn btn-sm" data-act="doLogout">' + ic('logout', 'ic-sm') + ' 退出</button>';
    } else {
      o += '<span class="tag tag-info">' + ic('info', 'ic-sm') + ' 游客剩余 ' + state.guestLeft + ' / ' +
        CONFIG.guestQuota + ' 次</span>';
      o += '<button class="btn btn-sm" data-act="go" data-route="login">' + ic('key', 'ic-sm') + ' 登录</button>';
      o += '<button class="btn btn-sm btn-primary" data-act="go" data-route="register">' + ic('user', 'ic-sm') + ' 注册</button>';
    }
    o += '<button class="btn btn-sm btn-ghost" data-act="showProtoInfo" title="原型说明与覆盖范围">' +
      ic('info', 'ic-sm') + '</button>';
    tr.innerHTML = o;
    hydrateIcons(tr);
  }
}
function render(opts){
  var o = opts || {};
  var app = document.getElementById('app');
  if (!app) return;
  var fn = VIEWS[state.route] || VIEWS.notFound;
  var html;
  try {
    html = fn();
  } catch (e){
    html = '<div class="card">' + alertBox('err', '原型渲染出现异常', esc(String(e && e.message ? e.message : e))) + '</div>';
  }
  app.innerHTML = html;
  hydrateIcons(app);
  renderTopnav();
  if (!o.keepScroll && window.scrollTo) window.scrollTo({top:0, behavior:'auto'});
  if (!o.keepScroll){
    var t = document.getElementById('app');
    if (t && t.scrollIntoView) { /* 保持顶部 */ }
  }
}
/* 对比视图需要 2 ～ 4 条记录。直接进入该路由（未经过历史页勾选）时，
   从历史记录中预置 3 条作为示例选择，避免落入空态 —— 空态另有「少于 2 条」的
   明确限制提示路径（由 viewCompare 自行处理）。 */
function seedCompareSel(){
  if (!state.compareSel || state.compareSel.length < 2){
    if (RECORDS.length >= 2) state.compareSel = [RECORDS[0], RECORDS[1], RECORDS[4]];
  }
}
function goto(route, opts){
  if (!route || !VIEWS[route]) route = 'notFound';
  if (AUTH_ROUTES.indexOf(route) >= 0 && !state.authed){
    toast('该页面需要登录后访问，已保留原访问路径', 'warn');
    state.route = 'login';
  } else if (ADMIN_ROUTES.indexOf(route) >= 0 && state.role !== 'admin'){
    toast('该页面仅管理员可见', 'err');
    state.route = 'notFound';
  } else {
    state.route = route;
    if (route === 'compare') seedCompareSel();
  }
  var h = ROUTE_HASH[state.route] || '#/';
  if (window.location && window.location.hash !== h){
    window.location.hash = h;
  }
  render();
}
function routeFromHash(){
  var h = (window.location && window.location.hash) || '';
  h = h.replace(/^#/, '');
  if (h === '' || h === '/') return 'home';
  if (h === '/recognize') return 'recognize';
  if (h === '/about') return 'about';
  if (h === '/login') return 'login';
  if (h === '/register') return 'register';
  if (h === '/history') return 'history';
  if (h === '/history/compare'){
    seedCompareSel();
    return 'compare';
  }
  if (h.indexOf('/history/') === 0) return 'historyDetail';
  if (h === '/profile') return 'profile';
  if (h === '/admin/users') return 'adminUsers';
  if (h === '/admin/records') return 'adminRecords';
  if (h === '/admin/config') return 'adminConfig';
  return 'notFound';
}

/* ---------- 业务动作 ---------- */
function loginAs(name){
  state.authed = true;
  state.me = {
    name:name,
    nick:(name === 'admin' ? '系统管理员' : '何永麒'),
    email:(name === 'admin' ? 'admin@seatong.local' : 'hyq2023@example.com'),
    reg:(name === 'admin' ? '2026-09-17 09:12:04' : '2026-09-17 14:33:51'),
    cnt:(name === 'admin' ? 0 : 8),
    role:(name === 'admin' ? 'admin' : 'user')
  };
  state.role = state.me.role;
  state.profileForm = {nick:state.me.nick, email:state.me.email};
}
function tryLogin(){
  var n = (state.loginForm.name || '').trim();
  var p = state.loginForm.pwd || '';
  if (!n || !p){
    state.loginErr = '请填写用户名与密码';
    state.loginLock = '';
    render();
    return;
  }
  var ok = ((n.toLowerCase() === 'admin' && p === 'Admin@2026') ||
            (n.toLowerCase() === 'hyq2023' && p === 'Seatong@2026'));
  if (ok){
    state.loginErr = ''; state.loginLock = '';
    loginAs(n.toLowerCase() === 'admin' ? 'admin' : 'hyq2023');
    state.loginForm = {name:'', pwd:''};
    toast('登录成功，令牌已签发（访问令牌 2 小时）', 'ok');
    goto('recognize');
    return;
  }
  state.loginErr = '用户名或密码不正确';
  state.loginLock = '';
  render();
}
function doRegister(){
  var f = state.regForm, r = pwdRules(f.pwd);
  state.regTouched = {name:true, pwd:true, pwd2:true, email:true};
  var bad = !nameValid(f.name) || !r.len || !r.mix || !r.notName || f.pwd !== f.pwd2;
  if (bad){
    render();
    toast('请按提示修正表单中的问题', 'err');
    return;
  }
  if (f.name.toLowerCase() === 'admin' || f.name.toLowerCase() === 'hyq2023'){
    render();
    toast('该用户名已被占用，请更换一个', 'err');
    return;
  }
  loginAs(f.name);
  state.regForm = {name:'', pwd:'', pwd2:'', email:''};
  state.regTouched = {name:false, pwd:false, pwd2:false, email:false};
  toast('注册成功并已自动登录', 'ok');
  goto('recognize');
}
function doLogoutNow(){
  state.authed = false;
  state.role = 'guest';
  state.me = {name:'', nick:'', email:'', reg:'', cnt:0, role:'user'};
  state.historySel = [];
  state.queue = [];
  closeModal();
  toast('已退出登录，令牌已失效', 'ok');
  goto('home');
}
function addFilesToQueue(n, forced){
  var limit = CONFIG.batchLimit;
  if (!forced && n > limit){
    modalOverLimit(n, limit);
    return;
  }
  var add = Math.min(n, limit);
  var errs = [];
  var samples = [
    {name:'holiday_photo.gif', size:'2.4 MB', err:'格式不合法，仅支持 jpg / jpeg / png / bmp'},
    {name:'scan_large.jpg',    size:'11.4 MB', err:'文件体积 11.4 MB 超出 10 MB 上限'},
    {name:'dive_notes.txt',    size:'0.3 MB', err:'按文件头特征判定为文本文件，文件类型不合法'}
  ];
  /* 超限确认后按「仅上传前 N 张」重入：用户已就分批上传作出明确选择，
     本次仅把前 N 张入队，不再二次弹出校验失败汇总弹窗（避免覆盖掉用户刚确认的上下文）。 */
  var quiet = !!forced;
  for (var i = 0; i < add; i++){
    if (state.queue.length >= limit) break;
    if (state.queue.length + 1 > limit) break;
    var injectErr = (!quiet && errs.length < 1 && i === add - 1 && add >= 3 && (state.uploadErr === ''));
    if (injectErr){
      var s = samples[state.queue.length % samples.length];
      state.queue.push({name:s.name, size:s.size, ok:false, err:s.err});
      errs.push({name:s.name, size:s.size, err:s.err});
    } else {
      var nm = 'IMG_' + (2300 + state.queue.length) + '.png';
      state.queue.push({name:nm, size:(1.4 + (state.queue.length % 5) * 0.7).toFixed(1) + ' MB', ok:true, err:''});
    }
  }
  var okN = 0;
  for (var k = 0; k < state.queue.length; k++) if (state.queue[k].ok) okN++;
  state.uploadErr = errs.length
    ? (state.queue.filter(function(x){ return !x.ok; }).length + ' 个文件未通过校验，其余文件已进入待上传队列')
    : '';
  render();
  if (errs.length) modalUploadErrors(state.queue.filter(function(x){ return !x.ok; }));
  else toast('已加入 ' + add + ' 张图像到待识别队列（已跳过超出单批上限的 ' +
    (n > limit ? (n - limit) : 0) + ' 张，可分批提交）', 'ok');
}
function startRecognize(){
  if (state.queue.length === 0) return;
  var okN = 0;
  for (var i = 0; i < state.queue.length; i++) if (state.queue[i].ok) okN++;
  if (okN === 0){
    toast('队列中没有通过校验的文件，请重新选择', 'err');
    return;
  }
  if (!state.authed && state.guestLeft <= 0){
    modalQuota();
    return;
  }
  state.batchRunning = true;
  state.batchCur = 0;
  state.stage = 1;
  render();
  var tick = 0;
  var timer = setInterval(function(){
    tick++;
    state.batchCur = Math.min(okN, tick);
    state.stage = tick === 1 ? 1 : (tick === 2 ? 2 : 3);
    if (tick === 1) render();
    if (state.batchCur >= okN){
      clearInterval(timer);
      state.batchRunning = false;
      state.stage = 3;
      state.resultSpIdx = 0;
      state.resultConf = 0.924;
      state.resultMs = 1180;
      if (!state.authed){
        state.guestLeft = Math.max(0, state.guestLeft - 1);
        toast('识别完成。游客结果不写入历史记录，注册后可保存', 'warn');
      } else {
        toast('识别完成，结果已保存到历史记录', 'ok');
      }
      render();
      if (!state.authed && state.guestLeft <= 0){
        state.guestLeftAfter = 0;
        modalQuota();
        state.guestLeftAfter = null;
      }
    } else {
      render();
    }
  }, 700);
}
</script>
<script>
/* ---------- 事件委托（单一入口） ---------- */
function numVal(id, dflt){
  var el = document.getElementById(id);
  if (!el) return dflt;
  var v = parseFloat(el.value);
  return isNaN(v) ? dflt : v;
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

document.addEventListener('click', function(ev){
  var mask = ev.target;
  if (mask && mask.id === 'modalMask'){ closeModal(); return; }

  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;

  if (el.tagName === 'INPUT' && el.type === 'checkbox'){
    var cAct = el.getAttribute('data-act');
    if (cAct === 'selHistory'){
      var cid = el.getAttribute('data-id');
      var pos = state.historySel.indexOf(cid);
      if (el.checked && pos < 0) state.historySel.push(cid);
      if (!el.checked && pos >= 0) state.historySel.splice(pos, 1);
      render({keepScroll:true});
    } else if (cAct === 'selAllHistory'){
      var all = filteredRecords();
      state.historySel = el.checked ? all.map(function(x){ return x.id; }) : [];
      render({keepScroll:true});
    }
    return;
  }

  var act = el.getAttribute('data-act');
  switch (act){
    /* 导航 */
    case 'go':
      if (ev.preventDefault) ev.preventDefault();
      goto(el.getAttribute('data-route'));
      break;
    case 'goHistory': goto('history'); break;
    case 'goRecognize': goto('recognize'); break;

    /* 弹窗基础 */
    case 'closeModal': closeModal(); break;
    case 'showProtoInfo': modalPrototypeInfo(); break;

    /* 上传链路 */
    case 'pickFiles': addFilesToQueue(3, false); break;
    case 'removeFile':
      var ri = parseInt(el.getAttribute('data-idx'), 10);
      state.queue.splice(ri, 1);
      if (state.queue.length === 0) state.uploadErr = '';
      render({keepScroll:true});
      toast('已移除该图像', '');
      break;
    case 'clearQueue':
      state.queue = [];
      state.uploadErr = '';
      render({keepScroll:true});
      toast('队列已清空，主操作按钮已置为禁用态', '');
      break;
    case 'acceptFirstN':
      closeModal();
      addFilesToQueue(parseInt(el.getAttribute('data-limit'), 10), true);
      break;
    case 'startRecognize': startRecognize(); break;

    /* 结果区 */
    case 'togglePreproc':
      state.showPreproc = !state.showPreproc;
      render({keepScroll:true});
      break;
    case 'toggleFold':
      var fk = el.getAttribute('data-key');
      state.folded[fk] = !state.folded[fk];
      render({keepScroll:true});
      break;
    case 'reRecognize':
      toast('已重置识别状态，可重新提交队列', '');
      goto('recognize');
      break;

    /* 认证 */
    case 'doLogin': tryLogin(); break;
    case 'doRegister': doRegister(); break;
    case 'doLogout':
      if (state.queue.length > 0) modalLogout();
      else modalLogout();
      break;
    case 'confirmLogout': doLogoutNow(); break;

    /* 额度引导 */
    case 'quotaRegister': closeModal(); goto('register'); break;
    case 'quotaLater': closeModal(); toast('稍后可在顶部导航进入注册', ''); break;

    /* 历史记录 */
    case 'openRecord':
      nySet('detailId', el.getAttribute('data-id'));
      goto('historyDetail');
      break;
    case 'resetHistoryFilter':
      state.historyFilters = {range:'all', from:'', to:'', sp:'all', kw:'', order:'desc'};
      state.historySel = [];
      render({keepScroll:true});
      toast('筛选条件已重置，全部记录已恢复', 'ok');
      break;
    case 'clearHistorySel':
      state.historySel = [];
      render({keepScroll:true});
      break;
    case 'goCompare':
      var sel = [];
      for (var i = 0; i < RECORDS.length; i++){
        if (state.historySel.indexOf(RECORDS[i].id) >= 0) sel.push(RECORDS[i]);
      }
      if (sel.length < 2 || sel.length > 4){
        toast('对比视图需要勾选 2 ～ 4 条记录，当前已选 ' + sel.length + ' 条', 'err');
        break;
      }
      state.compareSel = sel;
      goto('compare');
      break;
    case 'exportSelected':
      if (state.historySel.length === 0){ toast('请先勾选需要导出的记录', 'err'); break; }
      if (state.historySel.length > 5000){
        toast('单次导出上限 5000 条，当前 ' + state.historySel.length + ' 条，请缩小筛选范围', 'err');
        break;
      }
      toast('已导出 seatong_history_' + nowStr().replace(/[-: ]/g, '').slice(0, 14) + '.csv（UTF-8 with BOM，固定 8 列）', 'ok');
      break;
    case 'doExport':
      var allRec = filteredRecords();
      if (allRec.length > 5000){
        toast('当前匹配 ' + allRec.length + ' 条，超过单次导出上限 5000 条，请缩小筛选范围', 'err');
        break;
      }
      toast('已按当前筛选条件导出 ' + allRec.length + ' 条记录，文件名 seatong_history_' +
        nowStr().replace(/[-: ]/g, '').slice(0, 14) + '.csv', 'ok');
      break;
    case 'openDeleteRecord': modalDeleteRecord(el.getAttribute('data-id'), false); break;
    case 'confirmDeleteRecord':
      closeModal();
      toast('记录已删除。30 天内可通过平台恢复，超期不可恢复', 'ok');
      break;
    case 'bulkDeleteHistory':
      if (state.historySel.length > 100){
        toast('批量删除单次上限 100 条，当前已选 ' + state.historySel.length + ' 条，请分批操作', 'err');
        break;
      }
      modalDeleteRecord('', true);
      break;
    case 'confirmBulkDelete':
      closeModal();
      toast('已删除 ' + state.historySel.length + ' 条记录', 'ok');
      state.historySel = [];
      render({keepScroll:true});
      break;

    /* 个人中心 */
    case 'saveProfile':
      var nick = (document.getElementById('pf-nick') || {}).value || '';
      var mail = (document.getElementById('pf-mail') || {}).value || '';
      state.profileErr = {};
      if (nick.length < 2 || nick.length > 20) state.profileErr.nick = '昵称长度需为 2 ～ 20 字符，当前 ' + nick.length + ' 字符';
      if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) state.profileErr.email = '邮箱格式不正确，请检查后重新输入';
      if (state.profileErr.nick || state.profileErr.email){
        render({keepScroll:true});
        toast('请按提示修正表单中的问题', 'err');
        break;
      }
      state.profileForm = {nick:nick, email:mail};
      state.me.nick = nick; state.me.email = mail;
      render({keepScroll:true});
      toast('个人信息已保存，刷新页面后仍然保留', 'ok');
      break;
    case 'doChangePwd':
      var oldP = (document.getElementById('pw-old') || {}).value || '';
      var nwP = (document.getElementById('pw-nw') || {}).value || '';
      var nw2P = (document.getElementById('pw-nw2') || {}).value || '';
      state.pwdErr = {};
      if (!oldP) state.pwdErr.old = '请输入当前密码';
      if (nwP.length < 8 || nwP.length > 32) state.pwdErr.nw = '新密码长度需为 8 ～ 32 位';
      else if (!(/[A-Za-z]/.test(nwP) && /\d/.test(nwP))) state.pwdErr.nw = '新密码需同时包含字母与数字';
      else if (nwP.toLowerCase() === state.me.name.toLowerCase()) state.pwdErr.nw = '新密码不允许与用户名相同';
      if (nw2P !== nwP) state.pwdErr.nw2 = '两次输入的新密码不一致';
      if (state.pwdErr.old || state.pwdErr.nw || state.pwdErr.nw2){
        render({keepScroll:true});
        toast('请按提示修正表单中的问题', 'err');
        break;
      }
      state.pwdForm = {old:'', nw:'', nw2:''};
      state.pwdErr = {};
      toast('密码已更新，请重新登录', 'ok');
      state.authed = false; state.role = 'guest';
      goto('login');
      break;

    /* 管理员 · 用户管理 */
    case 'toggleUser': modalToggleUser(parseInt(el.getAttribute('data-id'), 10)); break;
    case 'confirmToggleUser':
      closeModal();
      toast('账号状态已更新，该用户既有令牌已立即失效', 'ok');
      break;
    case 'openResetPwd': modalResetPwd(parseInt(el.getAttribute('data-id'), 10)); break;
    case 'confirmResetPwd':
      closeModal();
      toast('已重置密码并生成一次性临时密码', 'ok');
      break;
    case 'clearAdminUserKw':
      state.adminUserKw = '';
      render({keepScroll:true});
      break;
    case 'clearAdminRecKw':
      state.adminRecKw = '';
      render({keepScroll:true});
      break;

    /* 管理员 · 记录管理 */
    case 'openDeleteAdminRecord': modalDeleteAdminRecord(el.getAttribute('data-id')); break;
    case 'confirmDeleteAdminRecord':
      closeModal();
      toast('记录已软删除，操作已记入审计日志', 'ok');
      break;

    /* 管理员 · 系统配置 */
    case 'toggleColorCorrect':
      state.cfg.colorCorrect = !state.cfg.colorCorrect;
      render({keepScroll:true});
      break;
    case 'openSaveConfig': modalSaveConfig(); break;
    case 'confirmSaveConfig':
      var t = clamp(numVal('cf-th', CONFIG.lowConfThreshold), 0.10, 0.90);
      var b = Math.round(clamp(numVal('cf-bl', CONFIG.batchLimit), 1, 20));
      var d = Math.round(clamp(numVal('cf-rd', CONFIG.retentionDays), 30, 365));
      CONFIG.lowConfThreshold = t;
      CONFIG.batchLimit = b;
      CONFIG.retentionDays = d;
      state.cfg = {lowConfThreshold:t, batchLimit:b, colorCorrect:state.cfg.colorCorrect, retentionDays:d, guestQuota:CONFIG.guestQuota};
      closeModal();
      render({keepScroll:true});
      toast('系统配置已保存并立即生效', 'ok');
      break;
    case 'resetConfig':
      state.cfg = {lowConfThreshold:0.40, batchLimit:9, colorCorrect:true, retentionDays:180, guestQuota:3};
      render({keepScroll:true});
      toast('表单已恢复默认值（尚未保存，需点击「保存配置」生效）', '');
      break;

    /* 兜底 */
    default:
      break;
  }
}, false);

/* input：只写 state，绝不 render（避免输入框失焦、光标跳回开头） */
document.addEventListener('input', function(ev){
  var el = ev.target;
  if (!el || !el.id) return;
  switch (el.id){
    case 'lg-name': state.loginForm.name = el.value; break;
    case 'lg-pwd': state.loginForm.pwd = el.value; break;
    case 'rg-name': state.regForm.name = el.value; break;
    case 'rg-pwd': state.regForm.pwd = el.value; break;
    case 'rg-pwd2': state.regForm.pwd2 = el.value; break;
    case 'rg-mail': state.regForm.email = el.value; break;
    case 'hf-kw': state.historyFilters.kw = el.value; break;
    case 'au-kw': state.adminUserKw = el.value; break;
    case 'ar-kw': state.adminRecKw = el.value; break;
    default: break;
  }
}, false);

/* change：写 state 后重绘并重算派生数值（此时已失焦，重绘安全） */
document.addEventListener('change', function(ev){
  var el = ev.target;
  if (!el || !el.id) return;
  switch (el.id){
    case 'hf-range':
      state.historyFilters.range = el.value;
      state.historySel = [];
      render({keepScroll:true});
      break;
    case 'hf-sp':
      state.historyFilters.sp = el.value;
      state.historySel = [];
      render({keepScroll:true});
      break;
    case 'hf-order':
      state.historyFilters.order = el.value;
      render({keepScroll:true});
      break;
    case 'hf-from':
      state.historyFilters.from = el.value;
      render({keepScroll:true});
      break;
    case 'hf-to':
      state.historyFilters.to = el.value;
      render({keepScroll:true});
      break;
    case 'rg-name':
      state.regTouched.name = true;
      render({keepScroll:true});
      break;
    case 'rg-pwd':
      state.regTouched.pwd = true;
      render({keepScroll:true});
      break;
    case 'rg-pwd2':
      state.regTouched.pwd2 = true;
      render({keepScroll:true});
      break;
    case 'au-kw':
      state.adminUserKw = el.value;
      render({keepScroll:true});
      break;
    case 'ar-kw':
      state.adminRecKw = el.value;
      render({keepScroll:true});
      break;
    default: break;
  }
}, false);

/* 键盘可达性：品牌区与开关支持 Enter / Space */
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  var el = ev.target;
  if (!el || !el.getAttribute) return;
  var act = el.getAttribute('data-act');
  if (!act) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'INPUT') return;
  if (act === 'go'){
    if (ev.preventDefault) ev.preventDefault();
    goto(el.getAttribute('data-route'));
  } else if (act === 'pickFiles'){
    if (ev.preventDefault) ev.preventDefault();
    addFilesToQueue(3, false);
  } else if (act === 'toggleColorCorrect'){
    if (ev.preventDefault) ev.preventDefault();
    state.cfg.colorCorrect = !state.cfg.colorCorrect;
    render({keepScroll:true});
  }
}, false);

/* 拖拽上传：拖拽悬停时边框高亮、文案变更 */
document.addEventListener('dragover', function(ev){
  var z = ev.target.closest ? ev.target.closest('#dropZone') : null;
  if (z){ if (ev.preventDefault) ev.preventDefault(); z.classList.add('hot'); }
}, false);
document.addEventListener('dragleave', function(ev){
  var z = ev.target.closest ? ev.target.closest('#dropZone') : null;
  if (z) z.classList.remove('hot');
}, false);
document.addEventListener('drop', function(ev){
  var z = ev.target.closest ? ev.target.closest('#dropZone') : null;
  if (z){
    if (ev.preventDefault) ev.preventDefault();
    z.classList.remove('hot');
    addFilesToQueue(3, false);
  }
}, false);

/* 哈希路由 */
if (window.addEventListener){
  window.addEventListener('hashchange', function(){
    var r = routeFromHash();
    if (r !== state.route){
      state.route = r;
      render();
    }
  });
}

/* ---------- 初始化 ---------- */
function init(){
  var r = routeFromHash();
  state.route = (r && VIEWS[r]) ? r : 'home';
  render();
  if (window.__FEEDBACK_PROBE) window.__FEEDBACK_PROBE(state);
}
if (typeof document !== 'undefined' && document.getElementById){
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
}
</script>
